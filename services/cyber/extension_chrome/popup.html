<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESIG'Guard</title>
    <style>
        /* --- STYLE DARK DASHBOARD --- */
        body { 
            width: 360px; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: #0f172a; /* Fond sombre Dashboard */
            color: #e2e8f0; 
            margin: 0; 
        }

        /* HEADER */
        .header {
            background-color: #1e293b; /* Sidebar color */
            padding: 15px;
            display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid #334155;
        }
        .header img { width: 40px; height: 40px; }
        .header h1 { margin: 0; font-size: 18px; color: #fff; }
        .header p { margin: 0; font-size: 11px; color: #94a3b8; }

        .container { padding: 15px; }

        /* BOUTON SCANNER (Style Bleu/Néon) */
        #scanBtn {
            width: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            color: white; border: none; padding: 14px;
            border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }
        #scanBtn:hover { filter: brightness(1.1); }
        #scanBtn:active { transform: scale(0.98); }

        /* LISTE DES CARDS */
        ul { list-style: none; padding: 0; margin-top: 20px; }
        
        .email-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 12px;
            cursor: pointer; transition: background 0.2s;
        }
        .email-card:hover { background-color: #334155; border-color: #475569; }

        .card-info { flex: 1; overflow: hidden; }
        .subject { font-weight: 600; color: #f1f5f9; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sender { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        /* --- JAUGE CIRCULAIRE (DONUT CHART) --- */
        .score-circle {
            position: relative; width: 42px; height: 42px;
            border-radius: 50%;
            /* Le dégradé conique fait la jauge */
            background: conic-gradient(var(--color) var(--percent), #334155 0);
            display: flex; align-items: center; justify-content: center;
        }
        /* Le centre du donut (trou) */
        .score-circle::before {
            content: attr(data-score);
            position: absolute; width: 34px; height: 34px;
            background-color: #1e293b; /* Même couleur que la carte */
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold; color: #fff;
        }

        /* FOOTER */
        .footer { display: flex; justify-content: space-between; margin-top: 15px; align-items: center; }
        #clearBtn { background: none; border: none; color: #64748b; font-size: 11px; cursor: pointer; text-decoration: underline; }
        #status-text { font-size: 10px; color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <img src="icone_bouclier_esigguard.jpg" alt="Logo">
        <div>
            <h1>ESIG'Guard</h1>
            <p>Analyse cyber en temps réel</p>
        </div>
    </div>

    <div class="container">
        <button id="scanBtn">ANALYSER CE MAIL</button>
        <ul id="email-list"></ul>
        
        <div class="footer">
            <span id="status-text">Prêt</span>
            <button id="clearBtn">Effacer l'historique</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
