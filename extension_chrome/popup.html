<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 320px; font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; }
        .header h1 { margin: 0; font-size: 18px; }
        .header p { margin: 5px 0 0; font-size: 12px; opacity: 0.8; }
        
        #email-list { list-style: none; padding: 0; margin: 0; }
        .email-item { background: white; border-bottom: 1px solid #eee; padding: 10px; cursor: pointer; transition: 0.2s; }
        .email-item:hover { background: #f1f3f4; }
        
        .row-top { display: flex; justify-content: space-between; align-items: center; }
        .subject { font-weight: bold; font-size: 14px; color: #333; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 200px;}
        .sender { font-size: 11px; color: #666; margin-top: 2px; }
        
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; }
        .risk-high { background-color: #d93025; } /* Rouge */
        .risk-med { background-color: #f9ab00; } /* Orange */
        .risk-low { background-color: #1e8e3e; } /* Vert */

        .actions { padding: 10px; text-align: center; }
        button { border: none; background: #ddd; color: #333; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px;}
        button:hover { background: #ccc; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ESIG'Guard 🛡️</h1>
        <p>Surveillance active</p>
    </div>
    
    <ul id="email-list">
        <li style="padding:20px; text-align:center; color:#999;">Aucun mail détecté...</li>
    </ul>

    <div class="actions">
        <button id="clearBtn">Nettoyer la liste</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
