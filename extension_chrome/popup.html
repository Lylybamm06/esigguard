<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ESIG'Guard</title>
    <style>
        /* --- STYLE GÉNÉRAL --- */
        body { width: 320px; font-family: 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; margin: 0; }
        
        /* --- EN-TÊTE AVEC ICÔNE --- */
        .header { 
            background: #1a73e8; /* Bleu Google */
            color: white; 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            gap: 15px; /* Espace entre logo et texte */
        }

        .logo-img {
            width: 40px;
            height: 40px;
            background: white; /* Petit fond blanc pour faire ressortir le logo */
            border-radius: 50%; /* Rond parfait */
            padding: 2px;
        }

        .title-container h1 { margin: 0; font-size: 18px; font-weight: 600; }
        .title-container p { margin: 2px 0 0; font-size: 12px; opacity: 0.9; }

        /* --- LISTE DES MAILS --- */
        #email-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
        
        /* Message vide par défaut */
        .empty-state { padding: 30px 20px; text-align: center; color: #888; font-style: italic; font-size: 13px; }

        /* --- ZONES D'ACTION (BOUTONS) --- */
        .actions { 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #ddd;
            background: white;
        }

        /* Le gros bouton SCAN */
        #scanBtn {
            flex: 2; /* Prend plus de place */
            background-color: #1a73e8; 
            color: white; 
            border: none; padding: 10px; border-radius: 4px; 
            font-weight: bold; cursor: pointer;
        }
        #scanBtn:hover { background-color: #1557b0; }

        /* Le petit bouton NETTOYER */
        #clearBtn {
            flex: 1;
            background-color: #f1f3f4; 
            color: #555; 
            border: none; padding: 10px; border-radius: 4px; 
            cursor: pointer; font-size: 12px;
        }
        #clearBtn:hover { background-color: #e8eaed; }
        
        /* --- MESSAGES DE STATUT --- */
        #status { padding: 0 15px 10px; text-align: center; font-size: 12px; font-weight: bold; color: #1a73e8; }

    </style>
</head>
<body>

    <div class="header">
        <img src="icon128.png" alt="Logo" class="logo-img">
        
        <div class="title-container">
            <h1>ESIG'Guard</h1>
            <p>Protection Anti-Phishing</p>
        </div>
    </div>

    <div id="status"></div>
    
    <ul id="email-list">
        <li class="empty-state">Ouvrez un mail et cliquez sur "Scanner"</li>
    </ul>

    <div class="actions">
        <button id="scanBtn">🔍 SCANNER</button>
        <button id="clearBtn">🗑️ VIDER</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
